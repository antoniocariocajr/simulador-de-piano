<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO Meta Tags -->
    <title>Piano Virtual - Simulador de Piano Online Gratuito</title>
    <meta name="description"
        content="Toque piano virtual gratuitamente no seu navegador. Simulador de piano interativo com 17 teclas, controle de volume e interface moderna. Aprenda e divirta-se!">
    <meta name="keywords"
        content="piano virtual, simulador de piano, piano online, tocar piano, música online, piano grátis, aprender piano">
    <meta name="author" content="Bill Carioca">

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://billcarioca.github.io/simulador-de-piano/">
    <meta property="og:title" content="Piano Virtual - Simulador de Piano Online">
    <meta property="og:description"
        content="Toque piano virtual gratuitamente no seu navegador. Interface moderna e intuitiva.">
    <meta property="og:image" content="./Captura da Web_12-10-2023_23493_127.0.0.1.jpeg">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://billcarioca.github.io/simulador-de-piano/">
    <meta property="twitter:title" content="Piano Virtual - Simulador de Piano Online">
    <meta property="twitter:description" content="Toque piano virtual gratuitamente no seu navegador.">
    <meta property="twitter:image" content="./Captura da Web_12-10-2023_23493_127.0.0.1.jpeg">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="./src/images/favicon.png">

    <!-- Stylesheets -->
    <link rel="stylesheet" href="./src/styles/reset.css">
    <link rel="stylesheet" href="./src/styles/main.css">
</head>

<body>
    <div class="container">
        <header>
            <h1 class="title">🎹 Piano Virtual</h1>
            <div class="controls">
                <div class="column volume-slider">
                    <label for="volume-control">
                        <span>Volume</span>
                    </label>
                    <input type="range" id="volume-control" min="0" max="1" value="0.5" step="0.01"
                        aria-label="Controle de volume do piano" aria-valuemin="0" aria-valuemax="1"
                        aria-valuenow="0.5">
                </div>
                <div class="column keys-check">
                    <label for="keys-toggle">
                        <span>Mostrar Teclas</span>
                    </label>
                    <input type="checkbox" id="keys-toggle" checked aria-label="Mostrar ou ocultar letras nas teclas"
                        role="switch" aria-checked="true">
                </div>
            </div>
        </header>

        <!-- Advanced Controls -->
        <div class="advanced-controls">
            <!-- Recording Controls -->
            <div class="control-section recording-section">
                <h3>🎙️ Gravação</h3>
                <div class="button-group">
                    <button id="record-btn" class="control-btn record-btn" aria-label="Iniciar gravação">
                        <span class="btn-icon">●</span> Gravar
                    </button>
                    <button id="stop-btn" class="control-btn stop-btn" aria-label="Parar gravação" disabled>
                        <span class="btn-icon">■</span> Parar
                    </button>
                    <button id="play-btn" class="control-btn play-btn" aria-label="Reproduzir gravação" disabled>
                        <span class="btn-icon">▶</span> Reproduzir
                    </button>
                </div>
                <div id="recording-status" class="status-text">Pronto para gravar</div>
            </div>

            <!-- Instrument Selector -->
            <div class="control-section instrument-section">
                <h3>🎺 Instrumento</h3>
                <select id="instrument-select" class="instrument-select" aria-label="Selecionar instrumento">
                    <option value="piano">🎹 Piano</option>
                    <option value="organ">🎻 Órgão</option>
                    <option value="synth">🎛️ Sintetizador</option>
                </select>
            </div>

            <!-- Metronome Controls -->
            <div class="control-section metronome-section">
                <h3>⏱️ Metrônomo</h3>
                <div class="metronome-controls">
                    <label class="switch">
                        <input type="checkbox" id="metronome-toggle" aria-label="Ativar metrônomo">
                        <span class="slider"></span>
                    </label>
                    <input type="number" id="bpm-input" value="120" min="40" max="240" aria-label="BPM do metrônomo">
                    <span class="bpm-label">BPM</span>
                </div>
                <div id="metronome-indicator" class="metronome-indicator"></div>
            </div>
        </div>

        <!-- Audio Visualizer -->
        <canvas id="audio-visualizer" width="700" height="100" aria-label="Visualizador de áudio"></canvas>

        <!-- Extended Piano Keys (25 keys - 2 octaves) -->
        <ul class="piano-keys" role="toolbar" aria-label="Teclas do piano">
            <!-- Lower Octave Extension -->
            <li class="key white" data-key="z" data-note="C3" role="button" tabindex="0"
                aria-label="Tecla Dó grave - pressione Z"><span>z</span></li>
            <li class="key black" data-key="x" data-note="C#3" role="button" tabindex="0"
                aria-label="Tecla Dó sustenido grave - pressione X"><span>x</span></li>
            <li class="key white" data-key="c" data-note="D3" role="button" tabindex="0"
                aria-label="Tecla Ré grave - pressione C"><span>c</span></li>
            <li class="key black" data-key="v" data-note="D#3" role="button" tabindex="0"
                aria-label="Tecla Ré sustenido grave - pressione V"><span>v</span></li>
            <li class="key white" data-key="b" data-note="E3" role="button" tabindex="0"
                aria-label="Tecla Mi grave - pressione B"><span>b</span></li>
            <li class="key white" data-key="n" data-note="F3" role="button" tabindex="0"
                aria-label="Tecla Fá grave - pressione N"><span>n</span></li>
            <li class="key black" data-key="m" data-note="F#3" role="button" tabindex="0"
                aria-label="Tecla Fá sustenido grave - pressione M"><span>m</span></li>
            <li class="key white" data-key="," data-note="G3" role="button" tabindex="0"
                aria-label="Tecla Sol grave - pressione vírgula"><span>,</span></li>

            <!-- Original Middle Octave (17 keys) -->
            <li class="key white" data-key="a" data-note="C4" role="button" tabindex="0"
                aria-label="Tecla Dó - pressione A"><span>a</span></li>
            <li class="key black" data-key="w" data-note="C#4" role="button" tabindex="0"
                aria-label="Tecla Dó sustenido - pressione W"><span>w</span></li>
            <li class="key white" data-key="s" data-note="D4" role="button" tabindex="0"
                aria-label="Tecla Ré - pressione S"><span>s</span></li>
            <li class="key black" data-key="e" data-note="D#4" role="button" tabindex="0"
                aria-label="Tecla Ré sustenido - pressione E"><span>e</span></li>
            <li class="key white" data-key="d" data-note="E4" role="button" tabindex="0"
                aria-label="Tecla Mi - pressione D"><span>d</span></li>
            <li class="key white" data-key="f" data-note="F4" role="button" tabindex="0"
                aria-label="Tecla Fá - pressione F"><span>f</span></li>
            <li class="key black" data-key="t" data-note="F#4" role="button" tabindex="0"
                aria-label="Tecla Fá sustenido - pressione T"><span>t</span></li>
            <li class="key white" data-key="g" data-note="G4" role="button" tabindex="0"
                aria-label="Tecla Sol - pressione G"><span>g</span></li>
            <li class="key black" data-key="y" data-note="G#4" role="button" tabindex="0"
                aria-label="Tecla Sol sustenido - pressione Y"><span>y</span></li>
            <li class="key white" data-key="h" data-note="A4" role="button" tabindex="0"
                aria-label="Tecla Lá - pressione H"><span>h</span></li>
            <li class="key black" data-key="u" data-note="A#4" role="button" tabindex="0"
                aria-label="Tecla Lá sustenido - pressione U"><span>u</span></li>
            <li class="key white" data-key="j" data-note="B4" role="button" tabindex="0"
                aria-label="Tecla Si - pressione J"><span>j</span></li>
            <li class="key white" data-key="k" data-note="C5" role="button" tabindex="0"
                aria-label="Tecla Dó - pressione K"><span>k</span></li>
            <li class="key black" data-key="o" data-note="C#5" role="button" tabindex="0"
                aria-label="Tecla Dó sustenido - pressione O"><span>o</span></li>
            <li class="key white" data-key="l" data-note="D5" role="button" tabindex="0"
                aria-label="Tecla Ré - pressione L"><span>l</span></li>
            <li class="key black" data-key="p" data-note="D#5" role="button" tabindex="0"
                aria-label="Tecla Ré sustenido - pressione P"><span>p</span></li>
            <li class="key white" data-key=";" data-note="E5" role="button" tabindex="0"
                aria-label="Tecla Mi - pressione ponto e vírgula"><span>;</span></li>
        </ul>
    </div>
    <script src="./src/scripts/engine.js" defer></script>
</body>

</html>
